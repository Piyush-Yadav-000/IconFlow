# App
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Cloudflare Workers AI
cloudflare.image.url=${CLOUDFLARE_IMAGE_URL}
cloudflare.image.api-key=${CLOUDFLARE_IMAGE_API_KEY}

# Background Removal API
bg.remove.api.url=${BG_REMOVE_API_URL}
bg.remove.api.key=${BG_REMOVE_API_KEY}

# Temporary storage
storage.temp.dir=${STORAGE_TEMP_DIR:./tmp-images}

# Multipart upload limits
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:50MB}
server.tomcat.max-swallow-size=${MAX_SWALLOW_SIZE:-1}

# Database
spring.datasource.url=${DATASOURCE_URL}
spring.datasource.username=${DATASOURCE_USER}
spring.datasource.password=${DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Frontend
frontend.url=${FRONTEND_URL:http://localhost:5173}

server.port=${PORT:8080}